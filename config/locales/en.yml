# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  omniauth:
    providers:
      google_oauth2: "Google Oauth2"
  sessions:
    magic_link_sent: "If an account exists with that email, you will receive a sign in link shortly."
    invalid_token: "This sign in link is invalid or has expired."
    signed_in: "You have been signed in successfully."
    signed_out: "You have been signed out."
    unauthenticated: "Please sign in to continue."
  aliases:
    created: "Alias created successfully."
    updated: "Alias updated successfully."
    destroyed: "Alias removed successfully."
  auth_tokens:
    connected: "Account connected successfully."
    disconnected: "Account disconnected successfully."
    failure: "Failed to connect account."
  calendar_preferences:
    updated: "Calendar preference saved successfully."
    no_calendars: "No calendars found in your Google account."
    api_error: "Unable to fetch calendars. Please try again."
    no_google_token: "Please connect your Google account first."
    error: "Failed to save calendar preference."
  user_mailer:
    login:
      subject: "Your sign in link"
