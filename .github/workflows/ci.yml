name: CI

on:
  pull_request:
  push:
    branches: [ main ]

env:
  ISAAC_GOOGLE_CLIENT_ID: client_id
  ISAAC_GOOGLE_CLIENT_SECRET: client_secret
  ISAAC_OPENROUTER_API_KEY: openrouter_api_key
  ISAAC_POSTMARK_API_KEY: postmark_api_key
  ISAAC_SENDER_ADDRESS: isaac@example.com
  RAILS_ENV: test
  SECRET_KEY_BASE: secret_key_base
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: primary
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: deterministic
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: salt

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      COVERAGE: 1
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Run CI
        run: ./bin/ci

  build_and_push_docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |-
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
